name = "carrieremoeder-bot"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Niet-geheime instellingen. Geheime sleutels (OPENAI_API_KEY, SYSTEME_API_KEY,
# BOT_SESSION_SECRET) staan als "Secret" in het Cloudflare-dashboard.
[vars]
BOT_PUBLIC_URL = "https://bot.carrieremoeder.com"

# AI: goedkoopste instelling. Alles via Luna, weinig denkwerk.
BOT_MODEL = "gpt-5.6-luna"
BOT_REASONING_EFFORT = "low"

# Inloggen via Systeme.io (geen wachtwoorden, geen eigen klantenlijst).
# Tags die toegang geven (komma-gescheiden, hoofdletters maken niet uit).
BOT_ACCESS_TAGS = "Always In Control BOT,Always In Control Bot + Training"
# Tag die de inlogmail-automatisering in Systeme.io start, en het veld met de inloglink.
BOT_LOGIN_TAG = "bot-inloglink"
BOT_LOGIN_FIELD = "bot_inloglink"
